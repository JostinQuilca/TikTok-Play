<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>TikTok Plotter 3D Live 🖨️✨</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Three.js CDN -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
  <!-- Main 1080x1920 viewport wrapper -->
  <div id="scene">
    <!-- 3D WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top Left Title Bar -->
    <div id="top-bar">
      <span class="live-badge">LIVE</span>
      <span class="live-title">let me print your picture</span>
    </div>

    <!-- Bottom Center Status Pill -->
    <div id="status-pill">
      <span class="status-dot"></span>
      <span id="status-pill-text">Ready to print</span>
    </div>

    <!-- Bottom Right Gift Legend -->
    <div id="legend-panel">
      <div class="legend-title">🎁 REGALOS</div>
      <div class="legend-item" id="legend-print">
        <span class="legend-emoji">🌹</span>
        <span class="legend-text">Rose → Print (1x1)</span>
      </div>
      <div class="legend-item" id="legend-big">
        <span class="legend-emoji">🍩</span>
        <span class="legend-text">Donut → Big (2x2)</span>
      </div>
      <div class="legend-item" id="legend-vip">
        <span class="legend-emoji">👑</span>
        <span class="legend-text">100+ → SUPER VIP</span>
      </div>
    </div>

    <!-- Debug HUD (Key H) -->
    <div id="debug-hud" class="hidden">
      <span id="hud-ws">WS: —</span>
      <span id="hud-queue">Queue: 0</span>
      <span id="hud-page">Slot: 0/9</span>
      <span id="hud-fps">FPS: —</span>
    </div>

    <!-- Mute Button (Key M) -->
    <div id="mute-btn" title="Presiona M o haz clic para silenciar">🔊</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
